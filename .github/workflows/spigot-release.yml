name: Spigot Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v2.13.1-ketting.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: spigot-release-${{ github.ref }}-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Test, build and publish Spigot
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Resolve and validate release tag
        id: release
        env:
          DISPATCH_TAG: ${{ inputs.tag_name }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG_NAME="$DISPATCH_TAG"
          else
            TAG_NAME="$GITHUB_REF_NAME"
          fi

          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi

          PROJECT_VERSION="$(./gradlew -q printVersion -Psnapshot=false --no-daemon)"
          TAG_VERSION="${TAG_NAME#v}"
          TAG_VERSION="${TAG_VERSION%%-*}"
          if [[ "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Tag version $TAG_VERSION does not match Gradle version $PROJECT_VERSION" >&2
            exit 1
          fi

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$PROJECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Test and build Spigot JAR
        run: ./gradlew :api:test :spigot:shadowJar -Psnapshot=false --no-daemon

      - name: Prepare release assets
        id: assets
        run: |
          JAR="build/libs/packetevents-spigot-${{ steps.release.outputs.version }}.jar"
          if [[ ! -f "$JAR" ]]; then
            echo "Expected Spigot JAR was not produced: $JAR" >&2
            exit 1
          fi

          JAR_NAME="$(basename "$JAR")"
          sha256sum "$JAR" | sed "s#  $JAR#  $JAR_NAME#" > "$JAR.sha256"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "checksum=$JAR.sha256" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          JAR: ${{ steps.assets.outputs.jar }}
          CHECKSUM: ${{ steps.assets.outputs.checksum }}
        run: |
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$JAR" "$CHECKSUM" \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG_NAME" "$JAR" "$CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "PacketEvents $RELEASE_VERSION (Ketting/Spigot)" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
